# Netlify 빌드 설정.
# ★publish 폴더에 떨어지는 _headers·_redirects 가 아래 설정보다 뒤에 적용된다.
#   둘이 겹치면 파일 쪽이 이긴다. 그래서 같은 내용을 양쪽에 적어 두었다.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
